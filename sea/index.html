const look = { yaw: 0, pitch: -0.03 }
const keys = new Set()
let fly = null

const VIEWS = {
  sea: { y: 3, pitch: -0.03 },
  bridge: { y: 22, pitch: -0.06 },
  air: { y: 650, pitch: -0.12 },
  above: { y: 4200, pitch: -0.1 },
}
function goTo(name) {
  const v = VIEWS[name]
  fly = { from: camera.position.y, to: v.y, fromPitch: look.pitch, toPitch: v.pitch, t: 0 }
}
for (const button of document.querySelectorAll('#views button')) button.addEventListener('click', () => goTo(button.dataset.view))

const canvas = renderer.domElement
let dragging = null
canvas.addEventListener('pointerdown', (e) => {
  dragging = { x: e.clientX, y: e.clientY }
  canvas.setPointerCapture(e.pointerId)
})
canvas.addEventListener('pointermove', (e) => {
  if (!dragging) return
  look.yaw -= (e.clientX - dragging.x) * 0.0028
  look.pitch = THREE.MathUtils.clamp(look.pitch - (e.clientY - dragging.y) * 0.0028, -1.5, 1.5)
  dragging = { x: e.clientX, y: e.clientY }
})
canvas.addEventListener('pointerup', () => (dragging = null))
canvas.addEventListener('pointercancel', () => (dragging = null))
addEventListener('keydown', (e) => {
  if (e.target instanceof HTMLInputElement && e.key.length > 1) return
  if (e.code === 'KeyH') document.body.classList.toggle('hidden')
  keys.add(e.code)
})
addEventListener('keyup', (e) => keys.delete(e.code))
addEventListener('blur', () => keys.clear())

const forward = new THREE.Vector3()
const right = new THREE.Vector3()
function moveCamera(dt) {
  if (fly) {
    fly.t = Math.min(fly.t + dt / 2.2, 1)
    const s = fly.t * fly.t * (3 - 2 * fly.t)
    // Climb geometrically, so a 3 m to 4 km flight does not spend its time near the top.
    camera.position.y = fly.from * (fly.to / fly.from) ** s
    look.pitch = THREE.MathUtils.lerp(fly.fromPitch, fly.toPitch, s)
    if (fly.t >= 1) fly = null
  }
  camera.rotation.set(look.pitch, look.yaw, 0)
  const speed = Math.max(6, camera.position.y * 0.8) * (keys.has('ShiftLeft') || keys.has('ShiftRight') ? 6 : 1)
  camera.getWorldDirection(forward)
  right.crossVectors(forward, camera.up).normalize()
  const move = new THREE.Vector3()
  if (keys.has('KeyW') || keys.has('ArrowUp')) move.add(forward)
  if (keys.has('KeyS') || keys.has('ArrowDown')) move.sub(forward)
  if (keys.has('KeyD') || keys.has('ArrowRight')) move.add(right)
  if (keys.has('KeyA') || keys.has('ArrowLeft')) move.sub(right)
  if (keys.has('KeyE') || keys.has('Space')) move.y += 1
  if (keys.has('KeyQ') || keys.has('KeyC')) move.y -= 1
  if (move.lengthSq() > 0) {
    fly = null
    camera.position.addScaledVector(move.normalize(), speed * dt)
  }
  const sea = seaState()
  const hs = Math.hypot(sea.windSea.hs, sea.swell.hs)
  camera.position.y = THREE.MathUtils.clamp(camera.position.y, 1.2 + hs * 0.7, 9000)
}

// ---------------------------------------------------------------------------------------------
// Frame
// ---------------------------------------------------------------------------------------------

const exposureBuffer = new Float32Array(4)
let exposurePending = false
let exposureTarget = 1

function readExposure() {
  if (exposurePending) return
  exposurePending = true
  renderer
    .readRenderTargetPixelsAsync(atmosphere.ambient, 0, 0, 1, 1, exposureBuffer)
    .then(() => {
      // Partial adaptation: dusk should still look like dusk.
      const lum = Math.max(exposureBuffer[3], 1e-5)
      exposureTarget = Math.min(0.095 / lum ** 0.82, 6000)
    })
    .finally(() => (exposurePending = false))
}

function resize() {
  camera.aspect = innerWidth / innerHeight
  camera.updateProjectionMatrix()
  renderer.setPixelRatio(dpr)
  renderer.setSize(innerWidth, innerHeight)
  const size = renderer.getDrawingBufferSize(new THREE.Vector2())
  post.setSize(size.x, size.y)
}
addEventListener('resize', resize)

let time = 0
let last = performance.now()
let frameMs = 16.7
let adaptAt = performance.now() + 3000
let ceiling = MAX_DPR
let frames = 0
const stats = $('stats')

function frame(now) {
  const dt = Math.min((now - last) / 1000, 0.1)
  last = now
  time += dt
  frameMs += ((dt * 1000) - frameMs) * 0.05

  moveCamera(dt)
  const instant = instantAt(state.hour)
  const sun = sunPosition(instant)
  toVector(sun, U.uSunTrue.value)
  toVector(moonPosition(instant), moonDir)
  // After nautical dusk the moon takes over as the light of the whole pipeline: sky, clouds, sea.
  const night = sun.el < NIGHT_ELEVATION
  U.uMoonLight.value = night ? 1 : 0
  U.uSun.value.copy(night ? moonDir : U.uSunTrue.value)
  // Illuminated fraction from the elongation, steepened for the opposition surge.
  const lit = 0.5 - 0.5 * U.uSunTrue.value.dot(moonDir)
  U.uSunE.value = night ? SUN_E * MOON_RATIO * lit ** 1.5 : SUN_E
  clouds.night = THREE.MathUtils.smoothstep(-sun.el, rad(4), rad(14))
  U.uHaze.value = state.haze
  U.uCoverage.value = state.coverage
  U.uCirrus.value = state.cirrus
  U.uTime.value = time
  const toward = rad(state.windFrom + 180)
  // Clouds drift at roughly the 1 km wind, about twice the surface wind.
  U.uCloudOffset.value.x += Math.sin(toward) * state.wind * 1.8 * dt
  U.uCloudOffset.value.y += -Math.cos(toward) * state.wind * 1.8 * dt

  const sea = seaState()
  // Whitecaps start around 4 m/s and spread steeply with wind (Monahan); micro-roughness follows Cox-Munk.
  const whitecaps = THREE.MathUtils.smoothstep(state.wind, 3, 20)
  waves.setSea(sea, whitecaps)
  // Breaking crests: where the combined Jacobian of all cascades nears a fold.
  oceanMaterial.uniforms.uFoamThreshold.value = THREE.MathUtils.lerp(0.3, 1.0, whitecaps)
  oceanMaterial.uniforms.uHs.value = Math.hypot(sea.windSea.hs, sea.swell.hs)
  oceanMaterial.uniforms.uMicroVariance.value = 0.003 + 0.0018 * state.wind
  oceanMaterial.uniforms.uOrigin.value.set(Math.round(camera.position.x * 2) / 2, Math.round(camera.position.z * 2) / 2)
  camera.updateMatrixWorld()

  waves.update(time, dt)
  oceanMaterial.uniforms.uSurf0.value = waves.surface[0]
  oceanMaterial.uniforms.uSurf1.value = waves.surface[1]
  oceanMaterial.uniforms.uSurf2.value = waves.surface[2]
  atmosphere.update()
  clouds.exposure += (exposureTarget - clouds.exposure) * Math.min(1, dt * 2)
  post.render()
  if (frames++ % 6 === 0) readExposure()

  // Adaptive resolution: drop pixels when frames run late, try more when they keep up, and
  // remember a step that did not keep up so it is not retried.
  if (now > adaptAt) {
    if (frameMs > 18.5 && dpr > 0.75) {
      ceiling = dpr - 0.25
      dpr = ceiling
      resize()
    } else if (frameMs < 17.2 && dpr < ceiling) {
      dpr = Math.min(dpr + 0.25, ceiling)
      resize()
    }
    adaptAt = now + 2500
  }

  if (frames % 15 === 0) {
    const size = renderer.getDrawingBufferSize(new THREE.Vector2())
    stats.textContent =
      `${Math.round(1000 / frameMs)} fps  ${frameMs.toFixed(1)} ms\n` +
      `${size.x}×${size.y}  DPR ${dpr.toFixed(2)}\n` +
      `${U.uMoonLight.value ? '月光' : '太陽'} ${((Math.asin(U.uSun.value.y) * 180) / Math.PI).toFixed(1)}°  高度 ${camera.position.y.toFixed(0)} m`
  }
  requestAnimationFrame(frame)
}

await generateNoise()
// Face the sun, with it off centre by an amount that still fits a portrait screen.
look.yaw = -sunPosition(instantAt(state.hour)).az + 0.25 * Math.min(1, camera.aspect / 1.6)
last = await nextFrame()
frame(last)
$('loading').classList.add('done')
</script>
</body>
</html>
